<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic+JS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    header, footer {
      background-color: aqua;
      padding: 15px;
      text-align: center;
    }
    nav {
      margin: 10px 0;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      margin: 20px 0;
      padding: 15px;
    }
    #home {
      background-color: pink;
    }
    #about {
      background-color: lightyellow;
      display: none; /* hidden until button clicked */
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: lightgreen;
    }
    table, th, td {
      border: 1px solid black;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Page</h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#about" onclick="showAbout()">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="home">
      <h2>Home Section</h2>
      <p>This paragraph will be updated by JavaScript.</p>
      <button onclick="runJS()">Click Me</button>
      <div id="output"></div>
    </section>

    <section id="about">
      <h2>About Section</h2>
      <p>My name is aditya</p>
      <table>
        <tr><th>Course Id</th><th>CourseName</th></tr>
        <tr><td>25SC2008</td><td>Full Stack</td></tr>
        <tr><td>25SC2006</td><td>Java</td></tr>
        <tr><td>25EC2206</td><td>Embedded system</td></tr>
        <tr><td>25AD2102</td><td>Ai&ML</td></tr>
        <tr><td>25MT1306</td><td>Maths</td></tr>
        <tr><td>25CS2102</td><td>Os</td></tr>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2026 Demo Page</p>
  </footer>

  <script>
    console.log("Page loaded successfully");

    function runJS() {
      document.getElementById("output").innerHTML =
        "<h3>Hello from innerHTML!</h3><p>This line came from JavaScript.</p>";
      console.log("Button was clicked at: " + new Date().toLocaleTimeString());
    }

    function showAbout() {
      document.getElementById("about").style.display = "block";
      window.location.hash = "about"; // scrolls to section
    }
  </script>
</body>
</html>
